<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ChainMind — Think in perspectives. Build with clarity.</title>
  <desc id="desc">A local-first AI collaboration workspace. A brief moves through review, human decision, and delivery.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c17"/><stop offset="1" stop-color="#0e1512"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#4d8870"/><stop offset="1" stop-color="#a6e8be"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#b8e7cc" opacity=".1"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect x="650" width="630" height="360" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="16" fill="none" stroke="#3c5446"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="48" y="39" width="35" height="35" rx="11" fill="#254a36" stroke="#76b590"/>
    <path d="M64 49c-9 0-13 15 0 15m3-15c13 0 9 15 0 15M61 56h10" fill="none" stroke="#aff0c8" stroke-width="2" stroke-linecap="round"/>
    <text x="95" y="64" fill="#e6f1e8" font-size="24" font-weight="700">ChainMind</text>
    <text x="48" y="150" fill="#e8f2eb" font-size="46" letter-spacing="-1.8">Think in perspectives.</text>
    <text x="48" y="207" fill="#8ce4b5" font-size="48" font-family="Georgia,serif" font-style="italic">Build with clarity.</text>
    <text x="49" y="253" fill="#a7beb0" font-size="16">A local-first workspace for multi-agent discussions.</text>
    <text x="49" y="307" fill="#8da99a" font-size="11" letter-spacing="1.5">NEXT.JS  /  TYPESCRIPT  /  ELECTRON</text>
    <path d="M749 129h133q30 0 30 30v48q0 30 30 30h160" stroke="url(#line)" stroke-width="1.5" fill="none"/>
    <circle cx="879" cy="129" r="4" fill="#a6e8be"/>
    <rect x="703" y="95" width="162" height="68" rx="9" fill="#203529" stroke="#536e5b"/>
    <text x="722" y="118" fill="#9dbaa5" font-family="monospace" font-size="10">01 / PERSPECTIVES</text>
    <text x="722" y="144" fill="#e7f2e9" font-size="16">Frame &amp; review</text>
    <rect x="918" y="95" width="219" height="68" rx="9" fill="#c9dfc9"/>
    <text x="937" y="118" fill="#3c6545" font-family="monospace" font-size="10">02 / HUMAN IN THE LOOP</text>
    <text x="937" y="144" fill="#234c30" font-size="16">You choose the direction</text>
    <rect x="983" y="203" width="184" height="68" rx="9" fill="#203529" stroke="#66876e"/>
    <text x="1002" y="226" fill="#9dbaa5" font-family="monospace" font-size="10">03 / DELIVERY</text>
    <text x="1002" y="252" fill="#e7f2e9" font-size="16">An actionable plan</text>
    <text x="710" y="306" fill="#8da99a" font-size="11" letter-spacing="1">REVIEW THE REASONING. OWN THE DECISION.</text>
